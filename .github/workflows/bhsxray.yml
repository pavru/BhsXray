#
# Builds the BhsXRay fork for Android and Windows. The upstream Build/publish
# workflows are disabled in this fork.
#
#   Xray-core: .github/xray-core-version.json. The metadata job resolves the
#              tag to one commit, so every job builds the same Xray-core.
#   Android:   one arm64-v8a APK; Xray-core is compiled into libXray.
#   Windows:   one EXE installer per architecture (per-machine, Program Files).
#              EXE builds omit VCore, which only the disabled MSIX mode uses.
#   Release:   pushing a v* tag publishes every artifact as a GitHub Release.
#              The fork numbers its own versions (brand.json "version"); the
#              tag must match it, as vX.Y.Z.
#
# Android signing secrets (without them manual runs are debug-signed and tag
# builds fail):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_PASSWORD      key password
#   ANDROID_KEY_ALIAS         key alias
#
# Layout: every job checks out this repository to OneXray/ and libXray as
# siblings, as build_scripts expects; outputs are written to output/ at the
# workspace root.

name: BhsXRay
run-name: BhsXRay · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bhsxray-${{ github.ref }}
  cancel-in-progress: false

# Every build input is pinned: tool versions here, actions by commit SHA,
# downloads by SHA-256. Update them deliberately, together, and record why.
env:
  LIBXRAY_REPOSITORY: pavru/libXray
  # pavru/libXray main at 733db61 (Windows Core service, config hash, warm ping).
  LIBXRAY_REF: 733db6143e57ef6d34a357bc762e01e4256009dd
  NDK_VERSION: r29
  ONEXRAY_FLUTTER_VERSION: "3.47.5"
  ONEXRAY_FLUTTER_COMMIT: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
  GO_VERSION: "1.27.1"
  PYTHON_VERSION: "3.14.7"
  UV_VERSION: "0.12.19"
  FASTFORGE_VERSION: "0.6.12"
  LLVM_MINGW_RELEASE: "20260922"
  LLVM_MINGW_SHA256: a317514a7a63badd692032c0c2b8e165f630bbaebbe7a3254348051f43a64949
  BUILD_NUMBER: ${{ github.run_number }}
  PYTHONUTF8: "1"

jobs:
  # =================================================================
  # Metadata — resolves dependency and Xray-core revisions once.
  # =================================================================
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      libxray_sha: ${{ steps.resolve.outputs.libxray_sha }}
      xray_version: ${{ steps.resolve.outputs.xray_version }}
      xray_query: ${{ steps.resolve.outputs.xray_query }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: OneXray

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LIBXRAY_REPOSITORY }}
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - name: Resolve revisions
        id: resolve
        run: |
          libxray_sha="$(git -C libXray rev-parse HEAD)"
          [[ "$libxray_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "libxray_sha=$libxray_sha" >> "$GITHUB_OUTPUT"
          mkdir -p metadata
          python3 - "$libxray_sha" <<'EOF'
          import json, os, subprocess, sys

          version = json.load(open("OneXray/.github/xray-core-version.json", encoding="utf-8"))["version"]
          query = subprocess.run(
              [sys.executable, "libXray/build/main.py", "resolve-xray-core", version],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"xray_version={version}\n")
              output.write(f"xray_query={query}\n")
          with open("metadata/build-metadata.json", "w", encoding="utf-8") as record:
              json.dump({
                  "app": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF"],
                  "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "libXray": sys.argv[1],
                  "xrayCore": {"version": version, "query": query},
              }, record, indent=2)
          EOF
          cat metadata/build-metadata.json

      - name: Upload build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metadata
          path: metadata/build-metadata.json
          if-no-files-found: error

  # =================================================================
  # Checks — fork tooling that needs no platform toolchain.
  # =================================================================
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: OneXray

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Rebrand is up to date
        run: python tool/rebrand/rebrand.py --check

      - name: Test rebrand tool
        run: python -m unittest discover -s tool/rebrand/tests -p 'test_*.py'

      - name: Tag matches the fork version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c "import json; print(json.load(open('tool/rebrand/brand.json'))['version'])")"
          if [[ "${GITHUB_REF_NAME%%-*}" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tool/rebrand/brand.json"
            exit 1
          fi

  # =================================================================
  # Android — one locally signed arm64-v8a APK.
  # =================================================================
  android:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ONEXRAY_LIBXRAY_SHA: ${{ needs.metadata.outputs.libxray_sha }}
      XRAY_CORE_REF: ${{ needs.metadata.outputs.xray_query }}
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: OneXray

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LIBXRAY_REPOSITORY }}
          ref: ${{ needs.metadata.outputs.libxray_sha }}
          path: libXray

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Setup Android NDK
        # libXray's Android builder invokes `gomobile bind`, which needs an NDK.
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release builds require the Android signing secrets"
              exit 1
            fi
            echo "::warning::Android signing secrets are missing; the APK is debug-signed"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/upload.jks
          cat > android/keystore/keystore.properties <<EOF
          storeFile=../keystore/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build
        run: uv run --project build_scripts python build_scripts/main.py OneXray android

      - name: Name artifacts
        working-directory: output
        run: |
          mv OneXray-android-universal.apk BhsXRay-android-arm64.apk
          mv provenance-android-*.json provenance-android.json

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: |
            output/BhsXRay-android-arm64.apk
            output/provenance-android.json
          if-no-files-found: error

  # =================================================================
  # Windows — EXE installer per architecture.
  #   x64 uses Windows Server 2025; arm64 uses GitHub's native Windows 11
  #   arm64 runner so Flutter and libXray match the target.
  # =================================================================
  windows:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            package_suffix: windows-amd64
            runner: windows-2025
          - arch: arm64
            goarch: arm64
            package_suffix: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ONEXRAY_LIBXRAY_SHA: ${{ needs.metadata.outputs.libxray_sha }}
      XRAY_CORE_REF: ${{ needs.metadata.outputs.xray_query }}
      GOARCH: ${{ matrix.goarch }}
      ONEXRAY_WINDOWS_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
        working-directory: OneXray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: OneXray

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LIBXRAY_REPOSITORY }}
          ref: ${{ needs.metadata.outputs.libxray_sha }}
          path: libXray

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Install LLVM-MinGW for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $name = "llvm-mingw-${env:LLVM_MINGW_RELEASE}-ucrt-aarch64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $name
          $extractPath = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Write-Host "Downloading LLVM-MinGW ${env:LLVM_MINGW_RELEASE}: $name"
          Invoke-WebRequest `
            -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/${env:LLVM_MINGW_RELEASE}/$name" `
            -OutFile $archivePath
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne ${env:LLVM_MINGW_SHA256}) {
            throw "LLVM-MinGW archive hash mismatch: $actual"
          }
          "ONEXRAY_LLVM_MINGW_RELEASE=${env:LLVM_MINGW_RELEASE}" >> $env:GITHUB_ENV
          "ONEXRAY_LLVM_MINGW_SHA256=$actual" >> $env:GITHUB_ENV
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath

          $binPath = Get-ChildItem -LiteralPath $extractPath -Directory |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "gcc.exe") } |
            Select-Object -First 1
          if ($null -eq $binPath) {
            throw "LLVM-MinGW bin directory was not found in $extractPath"
          }
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows ARM64 CGo toolchain
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          where.exe gcc.exe
          where.exe g++.exe

          $gccTarget = (& gcc.exe -dumpmachine).Trim()
          $gxxTarget = (& g++.exe -dumpmachine).Trim()
          $expectedTarget = '^aarch64-w64-(windows-gnu|mingw32)$'
          if ($gccTarget -notmatch $expectedTarget) {
            throw "Unexpected gcc target: $gccTarget"
          }
          if ($gxxTarget -notmatch $expectedTarget) {
            throw "Unexpected g++ target: $gxxTarget"
          }

      - name: Test build scripts
        working-directory: OneXray/build_scripts
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install Fastforge
        shell: pwsh
        run: |
          dart pub global activate fastforge ${env:FASTFORGE_VERSION}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pubCache = $env:PUB_CACHE
          if (-not $pubCache) {
            $pubCache = Join-Path $env:LOCALAPPDATA "Pub\Cache"
          }
          (Join-Path $pubCache "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Fastforge
        run: python -c "import subprocess; subprocess.run(['fastforge.bat', '--version'], check=True)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:GITHUB_WORKSPACE "references/windows-build"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $installer = Join-Path $toolDir "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $expectedHash) {
            throw "Inno Setup installer hash mismatch"
          }
          $installDir = Join-Path $toolDir "inno-setup"
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=`"$installDir`""
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not installed" }
          "INNO_SETUP_PATH=$installDir" >> $env:GITHUB_ENV

      - name: Build
        run: uv run --project build_scripts python build_scripts/main.py OneXray windows --windows-mode exe

      - name: Verify core CLI
        run: ./windows/app/OneXrayCore.exe -h

      - name: Name artifacts
        working-directory: output
        # Only the installer is published: it installs under Program Files, where
        # standard users cannot replace the elevated Core. The ZIP could be
        # extracted anywhere, so the App would refuse to connect from it.
        run: mv "OneXray-${{ matrix.package_suffix }}.exe" "BhsXRay-${{ matrix.package_suffix }}.exe"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: |
            output/BhsXRay-${{ matrix.package_suffix }}.exe
            output/provenance-windows-${{ matrix.arch }}-exe.json
          if-no-files-found: error

  # =================================================================
  # Release — v* tags publish every artifact after all builds succeed.
  # =================================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, checks, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -- * > SHA256SUMS
          ls -l
          prerelease=()
          # Only -alpha/-beta/-rc tags are prereleases.
          [[ "$TAG" =~ -(alpha|beta|rc) ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "BhsXRay $TAG" \
            --generate-notes --verify-tag "${prerelease[@]}" -- *
